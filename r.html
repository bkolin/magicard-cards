<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MagiCard</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  img { max-width: 100vw; max-height: 100vh; display: block; }
</style>
</head>
<body>
<!--
  Reveal page for the MagiCard NFC "Remote Device Reveal". The app writes a URL like
  https://bkolin.github.io/magicard-cards/r.html#h13_1 to an NFC tag. The spectator scans the
  tag on their own phone; this page paints the screen black and shows the card centered, so the
  card's transparent rounded corners sit on black no matter the phone's browser theme.
  The fragment is {suit}{rank}_{style}: suit c|d|h|s, rank 1-13, style 1|2.
-->
<img id="card" alt="">
<script>
  var id = (location.hash || "").replace(/^#/, "");
  if (/^[cdhs](?:[1-9]|1[0-3])_[12]$/.test(id)) {
    document.getElementById("card").src = "images/" + id + ".png";
  }
</script>
</body>
</html>
